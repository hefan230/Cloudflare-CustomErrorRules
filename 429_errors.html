<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Too many requests</title>
<style>
  :root{
    --bg:#0d0d0f;
    --bg-2:#151518;
    --ink:#e9e6df;
    --muted:#8a857c;
    --accent:#ff8a3d;
    --accent-soft:rgba(255,138,61,.14);
    --danger:#ff5a4d;
    --line:rgba(255,255,255,.07);
    --mono:"IBM Plex Mono","SF Mono","JetBrains Mono","PingFang SC","Hiragino Sans","Hiragino Kaku Gothic ProN","Microsoft YaHei","Yu Gothic",ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--mono);
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
    padding:32px 24px;
  }
  body::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:
      linear-gradient(var(--line) 1px,transparent 1px),
      linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:42px 42px;
    mask-image:radial-gradient(circle at 50% 42%,#000 0%,rgba(0,0,0,.35) 55%,transparent 80%);
    -webkit-mask-image:radial-gradient(circle at 50% 42%,#000 0%,rgba(0,0,0,.35) 55%,transparent 80%);
  }
  body::after{
    content:"";
    position:absolute;
    width:680px;height:680px;
    top:-180px;left:50%;
    transform:translateX(-50%);
    background:radial-gradient(circle,var(--accent-soft) 0%,transparent 65%);
    pointer-events:none;
  }

  .wrap{
    position:relative;
    z-index:2;
    text-align:center;
    max-width:560px;
    animation:rise .8s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

  .tag{
    display:inline-block;
    font-size:12px;
    letter-spacing:.32em;
    text-transform:uppercase;
    color:var(--accent);
    border:1px solid var(--accent-soft);
    background:var(--accent-soft);
    padding:6px 14px;
    border-radius:999px;
    margin-bottom:28px;
  }

  .num{
    font-size:clamp(90px,24vw,200px);
    font-weight:700;
    line-height:.9;
    letter-spacing:.02em;
    position:relative;
    display:inline-block;
    color:var(--ink);
    text-shadow:0 0 40px rgba(255,138,61,.25);
  }
  .num span{color:var(--accent)}
  .num::before,.num::after{
    content:attr(data-code);
    position:absolute;
    inset:0;
    opacity:.55;
  }
  .num::before{color:#3dd7ff;animation:g1 4s infinite steps(2)}
  .num::after{color:var(--accent);animation:g2 5.5s infinite steps(2)}
  @keyframes g1{0%,92%,100%{transform:none;opacity:0}93%{transform:translate(-3px,1px);opacity:.4}96%{transform:translate(2px,-1px);opacity:.4}}
  @keyframes g2{0%,90%,100%{transform:none;opacity:0}91%{transform:translate(2px,-2px);opacity:.35}97%{transform:translate(-2px,2px);opacity:.35}}

  h1{
    font-size:clamp(20px,4.6vw,26px);
    font-weight:700;
    margin:24px 0 12px;
    letter-spacing:.01em;
  }
  p.desc{
    font-size:14.5px;
    line-height:1.7;
    color:var(--muted);
    max-width:460px;
    margin:0 auto 34px;
  }

  .home{
    display:inline-flex;
    align-items:center;
    gap:10px;
    text-decoration:none;
    color:var(--bg);
    background:var(--accent);
    font-family:var(--mono);
    font-weight:600;
    font-size:14px;
    letter-spacing:.02em;
    padding:13px 26px;
    border:0;
    border-radius:10px;
    cursor:pointer;
    transition:transform .18s ease,box-shadow .18s ease,background .18s ease;
    box-shadow:0 8px 30px rgba(255,138,61,.28);
  }
  .home:hover{transform:translateY(-2px);box-shadow:0 12px 38px rgba(255,138,61,.4);background:#ffa15e}
  .home .arrow{transition:transform .5s ease;display:inline-block}
  .home:hover .arrow{transform:rotate(180deg)}

  .meta{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px 26px;
    font-size:12.5px;
    color:var(--muted);
    border-top:1px solid var(--line);
    padding-top:24px;
    margin-top:38px;
    margin-bottom:8px;
  }
  .meta .k{color:rgba(255,255,255,.35);margin-right:7px;letter-spacing:.04em}
  .meta .v{color:var(--ink)}

  .contact{
    margin-top:22px;
    font-size:13px;
    color:var(--muted);
  }
  .contact a{color:var(--accent);text-decoration:none}
  .contact a:hover{text-decoration:underline}

  .lang{
    position:fixed;
    top:22px;right:22px;
    z-index:5;
    display:flex;
    gap:4px;
    background:var(--bg-2);
    border:1px solid var(--line);
    border-radius:999px;
    padding:4px;
  }
  .lang button{
    font-family:var(--mono);
    font-size:12px;
    font-weight:500;
    color:var(--muted);
    background:transparent;
    border:0;
    cursor:pointer;
    padding:7px 13px;
    border-radius:999px;
    transition:color .15s ease,background .15s ease;
  }
  .lang button:hover{color:var(--ink)}
  .lang button.active{color:var(--bg);background:var(--accent)}

  @media (max-width:480px){
    .lang{top:16px;right:16px}
  }
</style>
</head>
<body>

  <nav class="lang" aria-label="language">
    <button data-lang="zh">中</button>
    <button data-lang="ja">日</button>
    <button data-lang="en">EN</button>
  </nav>

  <main class="wrap">
    <span class="tag" data-i18n="tag">RATE LIMIT</span>
    <div class="num" data-code="429" aria-hidden="true">4<span>2</span>9</div>
    <h1 data-i18n="title">Too many requests</h1>
    <p class="desc" data-i18n="desc">You've made too many requests in a short time and have been temporarily rate-limited. Please wait a moment and try again.</p>

    <button class="home" type="button" onclick="location.reload()">
      <span data-i18n="retry">Try again later</span>
      <span class="arrow">&#8635;</span>
    </button>

    <div class="meta" id="meta">
      <span id="mi-ip"><span class="k" data-i18n="ip">Your IP</span><span class="v" id="m-ip">::CLIENT_IP::</span></span>
      <span id="mi-ray"><span class="k">Ray ID</span><span class="v" id="m-ray">::RAY_ID::</span></span>
      <span id="mi-geo"><span class="k" data-i18n="geo">Location</span><span class="v" id="m-geo">::GEO::</span></span>
    </div>

    <p class="contact" data-i18n="contact">Think this is a mistake? Email <a href="mailto:admin@eqi.me">admin@eqi.me</a>.</p>
  </main>

<script>
  var i18n = {
    zh:{
      lang:"zh-CN", tag:"速率限制", title:"请求过于频繁",
      desc:"你在短时间内的请求过多，已被临时限速。请稍等片刻后再试。",
      retry:"稍后重试", ip:"你的 IP", geo:"地区",
      contact:'认为这是误判？请联系 <a href="mailto:admin@eqi.me">admin@eqi.me</a>。'
    },
    ja:{
      lang:"ja", tag:"レート制限", title:"リクエストが多すぎます",
      desc:"短時間に多くのリクエストが送信されたため、一時的にレート制限がかかっています。しばらく待ってから再度お試しください。",
      retry:"後でもう一度試す", ip:"あなたのIP", geo:"地域",
      contact:'誤りだと思われる場合は <a href="mailto:admin@eqi.me">admin@eqi.me</a> までご連絡ください。'
    },
    en:{
      lang:"en", tag:"RATE LIMIT", title:"Too many requests",
      desc:"You've made too many requests in a short time and have been temporarily rate-limited. Please wait a moment and try again.",
      retry:"Try again later", ip:"Your IP", geo:"Location",
      contact:'Think this is a mistake? Email <a href="mailto:admin@eqi.me">admin@eqi.me</a>.'
    }
  };

  function pickLang(){
    var list = navigator.languages && navigator.languages.length
      ? navigator.languages : [navigator.language || "en"];
    for(var i=0;i<list.length;i++){
      var code = (list[i]||"").toLowerCase();
      if(code.indexOf("zh")===0) return "zh";
      if(code.indexOf("ja")===0) return "ja";
      if(code.indexOf("en")===0) return "en";
    }
    return "en"; // 非中日英默认英文
  }

  function apply(lang){
    var t = i18n[lang] || i18n.en;
    document.documentElement.lang = t.lang;
    document.title = t.title;
    document.querySelectorAll("[data-i18n]").forEach(function(el){
      var k = el.getAttribute("data-i18n");
      if(!t[k]) return;
      if(k==="contact") el.innerHTML = t[k]; // 含 mailto 链接
      else el.textContent = t[k];
    });
    document.querySelectorAll(".lang button").forEach(function(b){
      b.classList.toggle("active", b.getAttribute("data-lang")===lang);
    });
  }

  apply(pickLang());

  // ----- 底部 IP / Ray ID / 地区 -----
  // 读取已被 Cloudflare 替换的 token 值（未替换则返回空）
  function tokenVal(valId){
    var v = (document.getElementById(valId).textContent || "").trim();
    return (v && v.indexOf("::") === -1) ? v : "";
  }
  // 有值则填入并显示，无值则隐藏该项
  function fillMeta(valId, itemId, val){
    if(val){ document.getElementById(valId).textContent = val; return true; }
    document.getElementById(itemId).style.display = "none";
    return false;
  }

  var tIp  = tokenVal("m-ip");
  var tRay = tokenVal("m-ray");
  var tGeo = tokenVal("m-geo");
  // 清掉未替换的原始 token 文字，避免短暂闪现 ::CLIENT_IP::
  ["m-ip","m-ray","m-geo"].forEach(function(id){
    if(!tokenVal(id)) document.getElementById(id).textContent = "";
  });

  function finishMeta(trace){
    trace = trace || {};
    var hasIp  = fillMeta("m-ip","mi-ip",   tIp  || trace.ip);
    var hasRay = fillMeta("m-ray","mi-ray", tRay || trace.ray);
    var hasGeo = fillMeta("m-geo","mi-geo", tGeo || trace.loc);
    if(!(hasIp || hasRay || hasGeo)) document.getElementById("meta").style.display = "none";
  }

  // 通过 Cloudflare 边缘的 /cdn-cgi/trace 获取真实 IP / 地区（比 ::CLIENT_IP:: 可靠）
  fetch("/cdn-cgi/trace", {cache:"no-store"})
    .then(function(r){ return r.text(); })
    .then(function(txt){
      var d = {};
      txt.trim().split("\n").forEach(function(line){
        var i = line.indexOf("=");
        if(i > 0) d[line.slice(0,i)] = line.slice(i+1);
      });
      finishMeta(d);
    })
    .catch(function(){ finishMeta(null); });

  document.querySelectorAll(".lang button").forEach(function(b){
    b.addEventListener("click", function(){ apply(b.getAttribute("data-lang")); });
  });
</script>
</body>
</html>
