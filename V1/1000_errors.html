<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cloudflare error</title>
<style>
  :root{
    --bg:#0d0d0f;
    --bg-2:#151518;
    --ink:#e9e6df;
    --muted:#8a857c;
    --accent:#ff8a3d;
    --accent-soft:rgba(255,138,61,.14);
    --danger:#ff5a4d;
    --line:rgba(255,255,255,.07);
    --mono:"IBM Plex Mono","SF Mono","JetBrains Mono","PingFang SC","Hiragino Sans","Hiragino Kaku Gothic ProN","Microsoft YaHei","Yu Gothic",ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--mono);
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
    padding:32px 24px;
  }
  body::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:
      linear-gradient(var(--line) 1px,transparent 1px),
      linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:42px 42px;
    mask-image:radial-gradient(circle at 50% 42%,#000 0%,rgba(0,0,0,.35) 55%,transparent 80%);
    -webkit-mask-image:radial-gradient(circle at 50% 42%,#000 0%,rgba(0,0,0,.35) 55%,transparent 80%);
  }
  body::after{
    content:"";
    position:absolute;
    width:680px;height:680px;
    top:-180px;left:50%;
    transform:translateX(-50%);
    background:radial-gradient(circle,var(--accent-soft) 0%,transparent 65%);
    pointer-events:none;
  }
  .wrap{
    position:relative;
    z-index:2;
    text-align:center;
    max-width:580px;
    animation:rise .8s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  .tag{
    display:inline-block;
    font-size:12px;
    letter-spacing:.32em;
    text-transform:uppercase;
    color:var(--accent);
    border:1px solid var(--accent-soft);
    background:var(--accent-soft);
    padding:6px 14px;
    border-radius:999px;
    margin-bottom:28px;
  }
  .num{
    font-size:clamp(56px,15vw,130px);
    font-weight:700;
    line-height:.9;
    letter-spacing:.02em;
    position:relative;
    display:inline-block;
    color:var(--ink);
    text-shadow:0 0 40px rgba(255,138,61,.25);
  }
  .num span{color:var(--accent)}
  .num::before,.num::after{
    content:attr(data-code);
    position:absolute;
    inset:0;
    opacity:.55;
  }
  .num::before{color:#3dd7ff;animation:g1 4s infinite steps(2)}
  .num::after{color:var(--accent);animation:g2 5.5s infinite steps(2)}
  @keyframes g1{0%,92%,100%{transform:none;opacity:0}93%{transform:translate(-3px,1px);opacity:.4}96%{transform:translate(2px,-1px);opacity:.4}}
  @keyframes g2{0%,90%,100%{transform:none;opacity:0}91%{transform:translate(2px,-2px);opacity:.35}97%{transform:translate(-2px,2px);opacity:.35}}
  h1{font-size:clamp(20px,4.6vw,26px);font-weight:700;margin:24px 0 12px;letter-spacing:.01em}
  p.desc{font-size:14.5px;line-height:1.7;color:var(--muted);max-width:460px;margin:0 auto 34px}
  .home{
    display:inline-flex;align-items:center;gap:10px;
    text-decoration:none;color:var(--bg);background:var(--accent);
    font-family:var(--mono);font-weight:600;font-size:14px;letter-spacing:.02em;
    padding:13px 26px;border-radius:10px;
    transition:transform .18s ease,box-shadow .18s ease,background .18s ease;
    box-shadow:0 8px 30px rgba(255,138,61,.28);
  }
  .home:hover{transform:translateY(-2px);box-shadow:0 12px 38px rgba(255,138,61,.4);background:#ffa15e}
  .home .arrow{transition:transform .18s ease}
  .home:hover .arrow{transform:translateX(4px)}
  .meta{
    display:flex;flex-wrap:wrap;justify-content:center;gap:10px 26px;
    font-size:12.5px;color:var(--muted);
    border-top:1px solid var(--line);padding-top:24px;margin-top:38px;margin-bottom:8px;
  }
  .meta .k{color:rgba(255,255,255,.35);margin-right:7px;letter-spacing:.04em}
  .meta .v{color:var(--ink)}
  .contact{margin-top:22px;font-size:13px;color:var(--muted)}
  .contact a{color:var(--accent);text-decoration:none}
  .contact a:hover{text-decoration:underline}
  .lang{
    position:fixed;top:22px;right:22px;z-index:5;
    display:flex;gap:4px;
    background:var(--bg-2);border:1px solid var(--line);border-radius:999px;padding:4px;
  }
  .lang button{
    font-family:var(--mono);font-size:12px;font-weight:500;color:var(--muted);
    background:transparent;border:0;cursor:pointer;padding:7px 13px;
    border-radius:999px;transition:color .15s ease,background .15s ease;
  }
  .lang button:hover{color:var(--ink)}
  .lang button.active{color:var(--bg);background:var(--accent)}
  @media(max-width:480px){.lang{top:16px;right:16px}}
</style>
</head>
<body>

  <nav class="lang" aria-label="language">
    <button data-lang="zh">中</button>
    <button data-lang="ja">日</button>
    <button data-lang="en">EN</button>
  </nav>

  <main class="wrap">
    <span class="tag" data-i18n="tag">CF ERROR</span>
    <div class="num" id="num" data-code="10XX" aria-hidden="true">10<span>X</span>X</div>
    <h1 data-i18n="title">Cloudflare error</h1>
    <p class="desc" id="desc" data-i18n="desc">Cloudflare was unable to complete your request due to a configuration or network issue.</p>

    <a class="home" href="https://hefan.me/">
      <span data-i18n="home">Back to home</span>
      <span class="arrow">&rarr;</span>
    </a>

    <div class="meta" id="meta" style="display:none">
      <span id="mi-ip"><span class="k" data-i18n="ip">Your IP</span><span class="v" id="m-ip">::CLIENT_IP::</span></span>
      <span id="mi-ray"><span class="k">Ray ID</span><span class="v" id="m-ray">::RAY_ID::</span></span>
      <span id="mi-geo"><span class="k" data-i18n="geo">Location</span><span class="v" id="m-geo">::GEO::</span></span>
    </div>

    <p class="contact" data-i18n="contact">Still having issues? Email <a href="mailto:admin@eqi.me">admin@eqi.me</a>.</p>
  </main>

  <div id="cfbox" style="display:none">::CLOUDFLARE_ERROR_1000S_BOX::</div>

<script>
  var i18n = {
    zh:{
      lang:"zh-CN", tag:"CF 错误", title:"Cloudflare 错误",
      desc:"Cloudflare 因配置或网络问题无法完成你的请求。",
      home:"返回首页", ip:"你的 IP", geo:"地区",
      contact:'仍有问题？请联系 <a href="mailto:admin@eqi.me">admin@eqi.me</a>。'
    },
    ja:{
      lang:"ja", tag:"CF エラー", title:"Cloudflare エラー",
      desc:"設定またはネットワークの問題により、Cloudflare がリクエストを完了できませんでした。",
      home:"ホームに戻る", ip:"あなたのIP", geo:"地域",
      contact:'問題が続く場合は <a href="mailto:admin@eqi.me">admin@eqi.me</a> までご連絡ください。'
    },
    en:{
      lang:"en", tag:"CF ERROR", title:"Cloudflare error",
      desc:"Cloudflare was unable to complete your request due to a configuration or network issue.",
      home:"Back to home", ip:"Your IP", geo:"Location",
      contact:'Still having issues? Email <a href="mailto:admin@eqi.me">admin@eqi.me</a>.'
    }
  };

  var reasons = {
    zh:{
      1000:"DNS 指向了被禁止的 IP 地址。",
      1001:"DNS 解析失败，无法解析域名。",
      1002:"访问受限，该域名不可使用。",
      1003:"不允许直接通过 IP 地址访问。",
      1004:"该主机未配置为服务 Web 流量。",
      1010:"本站所有者已基于浏览器特征禁止你的访问。",
      1011:"拒绝访问：不允许盗链资源。",
      1012:"访问被拒绝。",
      1013:"HTTP 主机名与 TXT 记录主机名不匹配。",
      1016:"源站 DNS 解析出错。",
      1018:"无法找到该主机。",
      1019:"Cloudflare 服务器计算错误。",
      1020:"根据防火墙规则，访问被拒绝。",
      1023:"无法找到该主机。"
    },
    ja:{
      1000:"DNS が禁止された IP アドレスを指しています。",
      1001:"DNS の解決に失敗しました。",
      1002:"このドメインへのアクセスは制限されています。",
      1003:"IP アドレスによる直接アクセスは許可されていません。",
      1004:"このホストは Web トラフィックを提供するよう設定されていません。",
      1010:"サイト所有者がブラウザの特徴に基づきアクセスをブロックしました。",
      1011:"ホットリンクは禁止されています。",
      1012:"アクセスが拒否されました。",
      1013:"HTTP ホスト名と TXT レコードのホスト名が一致しません。",
      1016:"オリジンの DNS エラーです。",
      1018:"ホストが見つかりません。",
      1019:"Cloudflare サーバーでエラーが発生しました。",
      1020:"ファイアウォールルールによりアクセスが拒否されました。",
      1023:"ホストが見つかりません。"
    },
    en:{
      1000:"The DNS points to a prohibited IP address.",
      1001:"DNS resolution error — the domain could not be resolved.",
      1002:"Access is restricted for this domain.",
      1003:"Direct IP access is not allowed.",
      1004:"The host is not configured to serve web traffic.",
      1010:"The site owner has blocked access based on your browser signature.",
      1011:"Access denied: hotlinking is not allowed.",
      1012:"Access denied.",
      1013:"The HTTP hostname and TXT record hostname do not match.",
      1016:"Origin DNS error.",
      1018:"The host could not be found.",
      1019:"Cloudflare compute server error.",
      1020:"Access denied by a firewall rule.",
      1023:"The host could not be found."
    }
  };

  var info = {};

  function parseCfBox(){
    var box = document.getElementById("cfbox");
    var txt = box ? (box.textContent || "") : "";
    var out = {}, m;
    if((m = txt.match(/Error reference number:\s*(\d{4})/i))) out.code = m[1];
    else if((m = txt.match(/\b(1\d{3})\b/))) out.code = m[1];
    return out;
  }

  function setCode(code){
    if(!code) return;
    var num = document.getElementById("num");
    num.setAttribute("data-code", code);
    var chars = code.split(""), html = "";
    for(var i=0;i<chars.length;i++){
      html += (i===2) ? "<span>"+chars[i]+"</span>" : chars[i];
    }
    num.innerHTML = html;
  }

  function tokenVal(id){
    var v=(document.getElementById(id).textContent||"").trim();
    return(v&&v.indexOf("::")===-1)?v:"";
  }
  function fillMeta(valId,itemId,val){
    if(val){document.getElementById(valId).textContent=val;return true;}
    document.getElementById(itemId).style.display="none";
    return false;
  }

  function pickLang(){
    var list=navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||"en"];
    for(var i=0;i<list.length;i++){
      var code=(list[i]||"").toLowerCase();
      if(code.indexOf("zh")===0)return"zh";
      if(code.indexOf("ja")===0)return"ja";
      if(code.indexOf("en")===0)return"en";
    }
    return"en";
  }

  function apply(lang){
    var t=i18n[lang]||i18n.en;
    document.documentElement.lang=t.lang;
    document.title=t.title;
    document.querySelectorAll("[data-i18n]").forEach(function(el){
      var k=el.getAttribute("data-i18n");
      if(!t[k])return;
      if(k==="desc"){
        if(info.code && reasons[lang][info.code]) el.textContent=reasons[lang][info.code];
        else el.textContent=t.desc;
      } else if(k==="contact"){
        el.innerHTML=t[k];
      } else {
        el.textContent=t[k];
      }
    });
    document.querySelectorAll(".lang button").forEach(function(b){
      b.classList.toggle("active",b.getAttribute("data-lang")===lang);
    });
  }

  info = parseCfBox();
  setCode(info.code);
  apply(pickLang());

  var tIp=tokenVal("m-ip"),tRay=tokenVal("m-ray"),tGeo=tokenVal("m-geo");
  ["m-ip","m-ray","m-geo"].forEach(function(id){
    if(!tokenVal(id))document.getElementById(id).textContent="";
  });

  function finishMeta(trace){
    trace=trace||{};
    var hasIp=fillMeta("m-ip","mi-ip",tIp||trace.ip);
    var hasRay=fillMeta("m-ray","mi-ray",tRay||trace.ray);
    var hasGeo=fillMeta("m-geo","mi-geo",tGeo||trace.loc);
    if(hasIp||hasRay||hasGeo)document.getElementById("meta").style.display="flex";
  }

  fetch("/cdn-cgi/trace",{cache:"no-store"})
    .then(function(r){return r.text();})
    .then(function(txt){
      var d={};
      txt.trim().split("\n").forEach(function(line){
        var i=line.indexOf("=");
        if(i>0)d[line.slice(0,i)]=line.slice(i+1);
      });
      finishMeta(d);
    })
    .catch(function(){finishMeta(null);});

  document.querySelectorAll(".lang button").forEach(function(b){
    b.addEventListener("click",function(){apply(b.getAttribute("data-lang"));});
  });
</script>
</body>
</html>
