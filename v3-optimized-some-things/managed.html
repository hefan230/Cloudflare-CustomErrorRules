<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">
<meta http-equiv="refresh" content="12">
<title>Checking your browser…</title>
<style>
  :root{
    --bg:#0d0d0f;
    --bg-2:#151518;
    --ink:#e9e6df;
    --muted:#8a857c;
    --accent:#ff8a3d;
    --accent-soft:rgba(255,138,61,.14);
    --danger:#ff5a4d;
    --line:rgba(255,255,255,.07);
    --mono:"IBM Plex Mono","SF Mono","JetBrains Mono","PingFang SC","Hiragino Sans","Hiragino Kaku Gothic ProN","Microsoft YaHei","Yu Gothic",ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--mono);
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
    padding:32px 24px;
    padding-top:max(32px,env(safe-area-inset-top));
    padding-bottom:max(32px,env(safe-area-inset-bottom));
  }
  body::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:
      linear-gradient(var(--line) 1px,transparent 1px),
      linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:42px 42px;
    mask-image:radial-gradient(circle at 50% 42%,#000 0%,rgba(0,0,0,.35) 55%,transparent 80%);
    -webkit-mask-image:radial-gradient(circle at 50% 42%,#000 0%,rgba(0,0,0,.35) 55%,transparent 80%);
  }
  body::after{
    content:"";
    position:absolute;
    width:680px;height:680px;
    top:-180px;left:50%;
    transform:translateX(-50%);
    background:radial-gradient(circle,var(--accent-soft) 0%,transparent 65%);
    pointer-events:none;
  }
  .wrap{
    position:relative;
    z-index:2;
    text-align:center;
    max-width:520px;
    animation:rise .8s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  .tag{
    display:inline-block;
    font-size:12px;
    letter-spacing:.32em;
    text-transform:uppercase;
    color:var(--accent);
    border:1px solid var(--accent-soft);
    background:var(--accent-soft);
    padding:6px 14px;
    border-radius:999px;
    margin-bottom:30px;
  }
  .spin-ring{
    width:72px;height:72px;
    margin:0 auto 30px;
    position:relative;
  }
  .spin-arc{
    width:100%;height:100%;
    border:2px solid var(--accent-soft);
    border-top-color:var(--accent);
    border-radius:50%;
    animation:spin 1.1s linear infinite;
  }
  .spin-ring::after{
    content:"";
    position:absolute;
    inset:-14px;
    border-radius:50%;
    border:1px solid var(--accent-soft);
    animation:pulse 2.6s ease-out infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%{transform:scale(.85);opacity:.7}70%{opacity:0}100%{transform:scale(1.5);opacity:0}}
  h1{font-size:clamp(20px,4.6vw,26px);font-weight:700;margin:0 0 12px;letter-spacing:.01em}
  p.desc{font-size:14.5px;line-height:1.7;color:var(--muted);max-width:440px;margin:0 auto 20px}
  .cookie-warn{font-size:13px;color:var(--danger);margin:10px 0}
  .widget-wrap{min-height:65px;display:flex;align-items:center;justify-content:center;margin-bottom:0}
  .meta{
    display:flex;flex-wrap:wrap;justify-content:center;gap:10px 26px;
    font-size:12.5px;color:var(--muted);
    border-top:1px solid var(--line);padding-top:24px;margin-top:34px;margin-bottom:8px;
  }
  .meta .k{color:rgba(255,255,255,.35);margin-right:7px;letter-spacing:.04em}
  .meta .v{color:var(--ink)}
  .contact{margin-top:22px;font-size:13px;color:var(--muted)}
  .contact a{color:var(--accent);text-decoration:none}
  .contact a:hover{text-decoration:underline}
  .lang{
    position:fixed;top:max(22px,env(safe-area-inset-top));right:max(22px,env(safe-area-inset-right));z-index:5;
    display:flex;gap:4px;
    background:var(--bg-2);border:1px solid var(--line);border-radius:999px;padding:4px;
  }
  .lang button{
    font-family:var(--mono);font-size:12px;font-weight:500;color:var(--muted);
    background:transparent;border:0;cursor:pointer;padding:7px 13px;
    border-radius:999px;transition:color .15s ease,background .15s ease;
  }
  .lang button:hover{color:var(--ink)}
  .lang button.active{color:var(--bg);background:var(--accent)}
  @media(max-width:480px){.lang{top:max(16px,env(safe-area-inset-top));right:16px}}
</style>
<meta name="theme-color" content="#f4efe5">
<script>
(function () {
  var theme;
  try {
    var saved = localStorage.getItem('preferredTheme');
    if (saved === 'light' || saved === 'dark') theme = saved;
  } catch (e) {}
  if (!theme) {
    theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', theme);
  document.documentElement.style.colorScheme = theme;
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', theme === 'light' ? '#f4efe5' : '#0d0d0f');
})();
</script>
<style id="hefan-theme">
  /* Light palette — variant A (paper). Dark keeps the original Cloudflare look. */
  :root{
    --bg:#f4efe5;
    --bg-2:#fffdf7;
    --ink:#241f18;
    --muted:#6c6357;
    --accent:#b8480c;
    --accent-hover:#963a07;
    --accent-soft:rgba(184,72,12,.12);
    --on-accent:#fffaf2;
    --danger:#b3261e;
    --line:rgba(36,31,24,.10);
    --faint:rgba(36,31,24,.38);
    --glow:rgba(184,72,12,.16);
    --shadow:rgba(70,45,20,.16);
    --glitch:#0e7490;
    --shield-glow:rgba(156,68,7,.18);
  }
  :root[data-theme="dark"]{
    --bg:#0d0d0f;
    --bg-2:#151518;
    --ink:#e9e6df;
    --muted:#8a857c;
    --accent:#ff8a3d;
    --accent-hover:#ffa15e;
    --accent-soft:rgba(255,138,61,.14);
    --on-accent:#0d0d0f;
    --danger:#ff5a4d;
    --line:rgba(255,255,255,.07);
    --faint:rgba(255,255,255,.35);
    --glow:rgba(255,138,61,.25);
    --shadow:rgba(255,138,61,.28);
    --glitch:#3dd7ff;
    --shield-glow:rgba(255,138,61,.35);
  }

  html{overflow-x:hidden;background-color:var(--bg)}
  body{overflow-y:auto;overflow-x:hidden}
  .wrap{margin:auto 0}

  /* Keep the status tag above the code, not inline next to it. */
  .tag{display:block;width:fit-content;margin:0 auto 28px}

  .num{text-shadow:0 0 40px var(--glow)}
  .num::before{color:var(--glitch)}
  .home{color:var(--on-accent);background:var(--accent);box-shadow:0 8px 30px var(--shadow)}
  .home:hover{background:var(--accent-hover);box-shadow:0 12px 38px var(--shadow)}
  .meta .k{color:var(--faint)}
  .shield svg{filter:drop-shadow(0 0 26px var(--shield-glow))}

  /* One unified pill: language + theme button, no divider. */
  .controls{
    position:fixed;
    top:max(22px,env(safe-area-inset-top));
    right:max(22px,env(safe-area-inset-right));
    z-index:5;
    display:flex;
    align-items:center;
    gap:2px;
    padding:4px;
    background:var(--bg-2);
    border:1px solid var(--line);
    border-radius:999px;
  }
  .lang{
    position:static;
    display:flex;
    gap:2px;
    padding:0;
    background:transparent;
    border:0;
    border-radius:0;
  }
  .lang button{
    font-family:var(--mono);
    font-size:12px;
    font-weight:500;
    color:var(--muted);
    background:transparent;
    border:0;
    cursor:pointer;
    padding:6px 11px;
    border-radius:999px;
    transition:color .15s ease,background .15s ease;
  }
  .lang button:hover{color:var(--ink);background:var(--accent-soft)}
  .lang button.active{color:var(--on-accent);background:var(--accent)}

  .theme-toggle{
    width:32px;height:32px;padding:0;
    display:inline-flex;align-items:center;justify-content:center;
    background:transparent;
    border:0;
    border-radius:999px;
    color:var(--muted);
    cursor:pointer;
    transition:color .15s ease,background .15s ease;
  }
  .theme-toggle:hover{color:var(--ink);background:var(--accent-soft)}
  .theme-toggle svg{width:17px;height:17px;display:block}
  .theme-toggle .icon-sun{display:none}
  :root[data-theme="dark"] .theme-toggle .icon-sun{display:block}
  :root[data-theme="dark"] .theme-toggle .icon-moon{display:none}

  /* Variant A decorations — light only */
  :root:not([data-theme="dark"]) body::before{background-size:34px 34px}
  :root:not([data-theme="dark"]) .tag{
    border-style:dashed;
    border-radius:4px;
    letter-spacing:.24em;
  }
  :root:not([data-theme="dark"]) .num{text-shadow:0 2px 0 #fff}
  :root:not([data-theme="dark"]) .home{
    border-radius:4px;
    box-shadow:4px 4px 0 var(--ink);
  }
  :root:not([data-theme="dark"]) .home:hover{
    transform:translate(-1px,-3px);
    box-shadow:6px 7px 0 var(--ink);
  }
  :root:not([data-theme="dark"]) .meta{border-top-style:dashed}
  :root:not([data-theme="dark"]) footer{color:var(--faint)}

  @media (max-width:480px){
    .controls{
      top:max(16px,env(safe-area-inset-top));
      right:max(16px,env(safe-area-inset-right));
    }
    .lang button{min-height:40px}
    .theme-toggle{width:40px;height:40px}
  }
  @media (max-width:768px),(max-height:680px){
    body{padding-top:max(88px,calc(env(safe-area-inset-top) + 72px))}
  }
  @media (prefers-reduced-motion:reduce){
    .wrap{animation:none}
    .num::before,.num::after{animation:none}
    *{transition:none !important}
  }
</style>
</head>
<body>

<noscript><div style="position:fixed;top:0;left:0;right:0;bottom:0;background:#0d0d0f;z-index:99;display:flex;align-items:center;justify-content:center;padding:24px"><p style="font-size:14px;color:#ff5a4d;text-align:center;font-family:monospace;line-height:1.9">JavaScript is required to complete this security check.<br>请启用 JavaScript 并刷新此页面。<br>JavaScript を有効にして再読み込みしてください。</p></div></noscript>

<div class="controls">
    <nav class="lang" aria-label="Language selection">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="zh">中</button>
      <button type="button" data-lang="ja">日</button>
    </nav>
    <button type="button" class="theme-toggle" id="themeToggle" aria-label="Switch to dark mode">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
      </svg>
    </button>
  </div>

<main class="wrap">
  <span class="tag" data-i18n="tag">SECURITY CHECK</span>

  <div class="spin-ring" aria-hidden="true">
    <div class="spin-arc"></div>
  </div>

  <h1 data-i18n="title">Checking your browser</h1>
  <p class="desc" data-i18n="desc">This process is automatic. Your browser will redirect to your requested content shortly.</p>

  <p class="cookie-warn" id="cookie-alert" data-i18n="cookie_warn" style="display:none">Please enable cookies and reload this page.</p>

  <div class="widget-wrap">
::CF_WIDGET_BOX::
  </div>

  <div class="meta" id="meta">
    <span id="mi-ip"><span class="k" data-i18n="ip">Your IP</span><span class="v" id="m-ip">::CLIENT_IP::</span></span>
    <span id="mi-ray"><span class="k">Ray ID</span><span class="v" id="m-ray">::RAY_ID::</span></span>
    <span id="mi-geo"><span class="k" data-i18n="geo">Location</span><span class="v" id="m-geo">::GEO::</span></span>
  </div>

  <p class="contact" data-i18n="contact">Think this is a mistake? Email <a href="mailto:admin@eqi.me">admin@eqi.me</a>.</p>
</main>

<script>
  var i18n = {
    zh:{
      lang:"zh-CN", tag:"安全检查", title:"正在验证您的浏览器",
      desc:"此过程将自动完成，您的浏览器很快将重定向至所请求的内容。",
      cookie_warn:"请启用 Cookie 并刷新此页面。",
      ip:"你的 IP", geo:"地区",
      contact:'遇到问题？请联系 <a href="mailto:admin@eqi.me">admin@eqi.me</a>。'
    },
    ja:{
      lang:"ja", tag:"セキュリティチェック", title:"ブラウザを確認しています",
      desc:"このプロセスは自動的に完了します。リクエストされたコンテンツにリダイレクトされます。",
      cookie_warn:"Cookie を有効にしてページを再読み込みしてください。",
      ip:"あなたのIP", geo:"地域",
      contact:'問題がある場合は <a href="mailto:admin@eqi.me">admin@eqi.me</a> までご連絡ください。'
    },
    en:{
      lang:"en", tag:"SECURITY CHECK", title:"Checking your browser",
      desc:"This process is automatic. Your browser will redirect to your requested content shortly.",
      cookie_warn:"Please enable cookies and reload this page.",
      ip:"Your IP", geo:"Location",
      contact:'Think this is a mistake? Email <a href="mailto:admin@eqi.me">admin@eqi.me</a>.'
    }
  };

  function pickLang(){
    var list=navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||"en"];
    for(var i=0;i<list.length;i++){
      var code=(list[i]||"").toLowerCase();
      if(code.indexOf("zh")===0)return"zh";
      if(code.indexOf("ja")===0)return"ja";
      if(code.indexOf("en")===0)return"en";
    }
    return"en";
  }

  function apply(lang){
    var t=i18n[lang]||i18n.en;
    document.documentElement.lang=t.lang;
    document.title=t.title;
    document.querySelectorAll("[data-i18n]").forEach(function(el){
      var k=el.getAttribute("data-i18n");
      if(!t[k])return;
      if(k==="contact")el.innerHTML=t[k];
      else el.textContent=t[k];
    });
    document.querySelectorAll(".lang button").forEach(function(b){
      b.classList.toggle("active",b.getAttribute("data-lang")===lang);
    });
  }

  apply(pickLang());

  function tokenVal(id){
    var v=(document.getElementById(id).textContent||"").trim();
    return(v&&v.indexOf("::")===-1)?v:"";
  }
  function fillMeta(valId,itemId,val){
    if(val){document.getElementById(valId).textContent=val;return true;}
    document.getElementById(itemId).style.display="none";
    return false;
  }

  var tIp=tokenVal("m-ip"),tRay=tokenVal("m-ray"),tGeo=tokenVal("m-geo");
  ["m-ip","m-ray","m-geo"].forEach(function(id){
    if(!tokenVal(id))document.getElementById(id).textContent="";
  });

  function finishMeta(trace){
    trace=trace||{};
    var hasIp=fillMeta("m-ip","mi-ip",tIp||trace.ip);
    var hasRay=fillMeta("m-ray","mi-ray",tRay||trace.ray);
    var hasGeo=fillMeta("m-geo","mi-geo",tGeo||trace.loc);
    if(!(hasIp||hasRay||hasGeo))document.getElementById("meta").style.display="none";
  }

  fetch("/cdn-cgi/trace",{cache:"no-store"})
    .then(function(r){return r.text();})
    .then(function(txt){
      var d={};
      txt.trim().split("\n").forEach(function(line){
        var i=line.indexOf("=");
        if(i>0)d[line.slice(0,i)]=line.slice(i+1);
      });
      finishMeta(d);
    })
    .catch(function(){finishMeta(null);});

  document.querySelectorAll(".lang button").forEach(function(b){
    b.addEventListener("click",function(){apply(b.getAttribute("data-lang"));});
  });
</script>
<script>
(function () {
  var THEME_KEY = "preferredTheme";
  var LANG_KEY = "preferredLanguage";
  var LABELS = {
    en: ["Switch to light mode", "Switch to dark mode"],
    zh: ["切换到浅色模式", "切换到深色模式"],
    ja: ["ライトモードに切り替え", "ダークモードに切り替え"]
  };
  var button = document.getElementById("themeToggle");

  function uiLang() {
    var l = (document.documentElement.lang || "en").toLowerCase();
    if (l.indexOf("zh") === 0) return "zh";
    if (l.indexOf("ja") === 0) return "ja";
    return "en";
  }
  function getTheme() {
    return document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
  }
  function syncTheme() {
    if (!button) return;
    var pair = LABELS[uiLang()] || LABELS.en;
    var isLight = getTheme() === "light";
    var label = isLight ? pair[1] : pair[0];
    button.setAttribute("aria-label", label);
    button.setAttribute("title", label);
    button.setAttribute("aria-pressed", String(isLight));
  }
  function applyTheme(theme, persist) {
    document.documentElement.setAttribute("data-theme", theme);
    document.documentElement.style.colorScheme = theme;
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", theme === "light" ? "#f4efe5" : "#0d0d0f");
    if (persist) {
      try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
    }
    syncTheme();
  }
  function detectLang() {
    var supported = ["en", "zh", "ja"];
    var urlLang = new URLSearchParams(window.location.search).get("lang");
    if (supported.indexOf(urlLang) !== -1) return urlLang;
    try {
      for (var i = 0; i < 3; i++) {
        var key = ["preferredLanguage", "lang", "preferredLang"][i];
        var saved = localStorage.getItem(key);
        if (supported.indexOf(saved) !== -1) return saved;
      }
    } catch (e) {}
    var list = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "en"];
    for (var j = 0; j < list.length; j++) {
      var base = String(list[j] || "").toLowerCase().split("-")[0];
      if (supported.indexOf(base) !== -1) return base;
    }
    return "en";
  }

  if (button) {
    button.addEventListener("click", function () {
      applyTheme(getTheme() === "light" ? "dark" : "light", true);
    });
  }

  if (window.matchMedia) {
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    var onChange = function (e) {
      try { if (localStorage.getItem(THEME_KEY)) return; } catch (err) {}
      applyTheme(e.matches ? "dark" : "light", false);
    };
    if (mq.addEventListener) mq.addEventListener("change", onChange);
    else if (mq.addListener) mq.addListener(onChange);
  }

  // Wrap the page's own apply() so the choice persists and the theme label follows it.
  if (typeof window.apply === "function") {
    var pageApply = window.apply;
    window.apply = function (lang) {
      pageApply(lang);
      try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
      var buttons = document.querySelectorAll(".lang button");
      for (var i = 0; i < buttons.length; i++) {
        buttons[i].setAttribute("aria-pressed", String(buttons[i].getAttribute("data-lang") === lang));
      }
      syncTheme();
    };
    window.apply(detectLang());
  } else {
    syncTheme();
  }
})();
</script>
</body>
</html>
